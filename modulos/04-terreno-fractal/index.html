<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terreno fractal · Geometría fractal</title>
<style>
:root{color-scheme:dark;--bg:#0c1516;--panel:#142122;--line:#304647;--text:#e6efea;--muted:#a8bfba;--accent:#9ee7c5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}
main{max-width:1200px;margin:auto;padding:32px clamp(16px,4vw,48px) 52px}
a{color:var(--accent)}
h1{font-size:clamp(2.75rem,7vw,5rem);line-height:1.04;letter-spacing:-.055em;margin:24px 0 12px}
h2{font-size:1.2rem;margin:0 0 12px}
p{margin:0 0 14px} .intro{color:var(--muted);max-width:66ch;margin-bottom:28px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px}
.viewer,aside{border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.viewer{overflow:hidden;display:flex;flex-direction:column}
canvas{width:100%;height:clamp(330px,49vw,520px);display:block;touch-action:none;cursor:grab;background:radial-gradient(ellipse at 50% 42%,#203637,#101c20 75%)}
canvas:active{cursor:grabbing}
.caption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line)}
.legend{display:inline-flex;align-items:center;gap:7px}
.gradient{width:68px;height:8px;border-radius:12px;background:linear-gradient(90deg,#2b7390,#4f9875,#a49066,#eee9da)}
aside{padding:18px;align-self:start}
label{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;margin:12px 0 4px}
output{color:var(--accent);font-variant-numeric:tabular-nums}
input,button{font:inherit} input[type=range]{display:block;width:100%;margin:0;accent-color:var(--accent)}
input[type=number],button{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#101b1d;color:var(--text)}
.check{justify-content:flex-start;align-items:center;margin:14px 0}
.check input{accent-color:var(--accent)}
button{cursor:pointer;margin-top:7px}button.primary{background:var(--accent);color:#102320;font-weight:700}
button:hover{filter:brightness(1.13)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:760px){.workspace{grid-template-columns:1fr}.caption{font-size:.78rem}}

:root{--bg:#0f1020;--panel:#17192c;--line:#33374d;--text:#f1eef9;--muted:#b8b6cd;--accent:#d4b8ff}
main{max-width:1680px;padding:24px clamp(16px,3vw,44px) 42px}
nav{font-size:.88rem}
.workspace{grid-template-columns:300px minmax(0,1fr);align-items:start;gap:18px;margin-top:18px}
aside{grid-column:1;grid-row:1}
.viewer{grid-column:2;grid-row:1}
h1{font-size:clamp(1.7rem,3vw,2.25rem);margin:14px 0 9px}
.intro{font-size:.9rem;margin-bottom:18px}
canvas{height:clamp(465px,calc(100svh - 106px),850px)}
select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#111426;color:var(--text)}
input[type=number],button{background:#111426}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zoom{white-space:nowrap}
@media(max-width:800px){
  .workspace{grid-template-columns:1fr}
  .viewer{grid-column:1;grid-row:2}
  aside{grid-row:1}
  canvas{height:clamp(320px,65vw,520px)}
}
</style>
</head>
<body>
<main>
<nav><a href="../../">← Geometría fractal</a></nav>
<div class="workspace">
<aside aria-labelledby="settings">
<header>
<p class="intro">Geometría fractal · Módulo 4</p>
<h1>Terreno fractal</h1>
<p class="intro">Explora un paisaje en 3D generado con el algoritmo Diamond–Square.</p>
</header>
<h2 id="settings">Controles</h2>
<label for="palette">Paleta de elevación</label>
<select id="palette">
<option value="volcanic">Volcánica</option>
<option value="alpine" selected>Alpina</option>
<option value="desert">Desierto</option>
<option value="violet">Violeta</option>
</select>
<label for="roughness">Rugosidad <output id="roughValue" for="roughness"></output></label>
<input id="roughness" type="range" min=".15" max=".9" step=".01" value=".64">
<label for="height">Altura del relieve <output id="heightValue" for="height"></output></label>
<input id="height" type="range" min=".35" max="1.8" step=".05" value="1.10">
<label for="water">Nivel del mar <output id="waterValue"></output></label>
<input id="water" type="range" min="0" max="100" value="30">
<label for="sun">Altura del sol <output id="sunValue"></output></label>
<input id="sun" type="range" min="12" max="85" value="37">
<label class="check"><input id="island" type="checkbox" checked> Forma de isla</label>
<label class="check"><input id="orbit" type="checkbox"> Órbita automática</label>
<label for="detail">Nivel de detalle <output id="detailValue" for="detail"></output></label>
<input id="detail" type="range" min="3" max="8" step="1" value="8">
<label for="seed">Semilla</label>
<input id="seed" type="number" min="0" max="4294967295" step="1" value="4817">
<label class="check"><input id="mesh" type="checkbox"> Mostrar malla</label>
<button class="primary" id="random" type="button">Generar otro terreno</button>
<div class="actions">
<button id="reset" type="button">Reiniciar vista</button>
<button id="save" type="button">Guardar PNG</button>
</div>
</aside>
<section class="viewer" aria-label="Visualización del terreno">
<canvas id="terrain" tabindex="0" aria-label="Terreno 3D. Usa las flechas para girar y las teclas más y menos para acercar y alejar."></canvas>
<div class="caption">
<span>Arrastra para girar · Rueda o teclas + y − para ajustar el zoom</span>
<span class="zoom">Zoom <output id="zoomValue">1.3×</output></span>
<span class="legend">Bajo <span class="gradient" id="gradient" aria-hidden="true"></span> Alto</span>
</div>
</section>
</div>
</main>
<script>
'use strict';
function seededRandom(seed) {
  let state = seed >>> 0;
  return () => {
    state = (Math.imul(1664525, state) + 1013904223) >>> 0;
    return state / 4294967296;
  };
}

function makeTerrain(detail, roughness, seed) {
  const span = 2 ** detail;
  const size = span + 1;
  const map = Array.from({length: size}, () => new Float64Array(size));
  const random = seededRandom(seed);
  for (const z of [0, span]) {
    for (const x of [0, span]) map[z][x] = (random() - .5) * .55;
  }

  let amplitude = .78;
  for (let step = span; step > 1; step /= 2) {
    const half = step / 2;
    for (let z = half; z < span; z += step) {
      for (let x = half; x < span; x += step) {
        const sum = map[z-half][x-half] + map[z-half][x+half]
          + map[z+half][x-half] + map[z+half][x+half];
        map[z][x] = sum / 4 + (random() - .5) * amplitude;
      }
    }
    for (let z = 0; z <= span; z += half) {
      const offset = z % step === 0 ? half : 0;
      for (let x = offset; x <= span; x += step) {
        let sum = 0;
        let count = 0;
        for (const [dx, dz] of [[-half,0],[half,0],[0,-half],[0,half]]) {
          const row = map[z + dz];
          if (row && x + dx >= 0 && x + dx <= span) {
            sum += row[x + dx];
            count++;
          }
        }
        map[z][x] = sum / count + (random() - .5) * amplitude;
      }
    }
    amplitude *= roughness;
  }
  return map;
}

const byId = id => document.getElementById(id);
const canvas = byId('terrain');

const roughness = byId('roughness');
const height = byId('height');
const detail = byId('detail');
const seed = byId('seed');
const mesh = byId('mesh');
const initialCamera = {yaw: -.40, pitch: .48, zoom: 1.30};
const camera = {...initialCamera};
const palettes = {
  volcanic: [[17,12,32],[58,21,53],[135,39,52],[222,78,34],[255,160,57],[255,229,159]],
  alpine: [[192,175,130],[76,104,50],[52,92,52],[78,116,65],[125,139,115],[220,228,221]],
  desert: [[79,42,54],[123,64,55],[169,91,54],[206,137,72],[228,178,111],[255,232,183]],
  violet: [[42,42,102],[74,55,135],[115,81,164],[162,106,194],[204,150,219],[244,218,251]]
};
const paletteSelect = byId('palette');
let palette = palettes.alpine;
let terrain;
let frame = 0;

function queueDraw() {
  if (frame === 0) frame = requestAnimationFrame(draw);
}

function rebuild() {
  terrain = makeTerrain(detail.valueAsNumber, roughness.valueAsNumber, seed.valueAsNumber);
  const span = terrain.length - 1;
  for (let z = 0; z <= span; z++) {
    for (let x = 0; x <= span; x++) {
      const dx = x / span - .5;
      const dz = z / span - .5;
      const distance = Math.hypot(dx * 1.03, dz * 1.18);
      const mountains = .31 * Math.exp(-28 * ((dx+.12)**2+(dz-.04)**2))
        + .23 * Math.exp(-41 * ((dx-.19)**2+(dz+.13)**2));
      const coast = island.checked ? .90 * Math.max(0,distance-.22) : -.10;
      terrain[z][x] = .075 + mountains + terrain[z][x] * .88 - coast;
    }
  }
  updateGeometry();
  byId('roughValue').value = roughness.valueAsNumber.toFixed(2);
  byId('detailValue').value = terrain.length + ' × ' + terrain.length;
  queueDraw();
}

function changeHeight() {
  byId('heightValue').value = height.valueAsNumber.toFixed(2) + '×';
  queueDraw();
}

function changePalette() {
  palette = palettes[paletteSelect.value];
  const stops = palette.map(rgb => 'rgb(' + rgb.join(',') + ')');
  byId('gradient').style.background = 'linear-gradient(90deg,' + stops.join(',') + ')';
  queueDraw();
}

const gl = canvas.getContext('webgl2', {antialias: true, preserveDrawingBuffer: true, alpha: false});
const water = byId('water');
const sun = byId('sun');
const island = byId('island');
const orbit = byId('orbit');
const vertexSource = `#version 300 es
layout(location=0) in vec3 position;
layout(location=1) in vec2 slope;
uniform vec4 cameraAngles;
uniform vec2 scale;
uniform float relief, sea;
uniform int mode;
out vec3 world;
out vec3 normal;
void main() {
  world = vec3(position.x, mode == 1 ? sea : position.y * relief, position.z);
  normal = normalize(vec3(-slope.x * relief, 1., -slope.y * relief));
  float x = world.x * cameraAngles.x - world.z * cameraAngles.y;
  float z = world.x * cameraAngles.y + world.z * cameraAngles.x;
  float y = world.y * cameraAngles.z - z * cameraAngles.w;
  float depth = z * cameraAngles.z + world.y * cameraAngles.w;
  float perspective = 1. - depth * .32;
  gl_Position = vec4(x * scale.x, y * scale.y - .07 * perspective, -depth * .36, perspective);
}`;
const fragmentSource = `#version 300 es
precision highp float;
precision highp int;
in vec3 world;
in vec3 normal;
uniform vec3 colors[6], light, viewDir;
uniform int mode;
uniform float sea, relief, time;
uniform sampler2D heightMap;
out vec4 pixel;
float hash(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * .1031);
  q += dot(q,q.yzx+33.33);
  return fract((q.x+q.y)*q.z);
}
float textureNoise(vec2 p) {
  vec2 i=floor(p), f=fract(p);
  vec2 t=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),t.x),
             mix(hash(i+vec2(0,1)),hash(i+1.),t.x),t.y);
}
float grain(vec2 p, float frequency) {
  float footprint=max(length(dFdx(p)),length(dFdy(p))) * frequency;
  return (textureNoise(p*frequency)-.5) * (1.-smoothstep(.18,.85,footprint));
}
vec3 atmosphere(vec3 rgb, float strength) {
  float distanceFade=smoothstep(.04,1.25,-dot(world,viewDir));
  return mix(rgb,vec3(.66,.76,.84),distanceFade*strength);
}

void main() {
  if (mode == 2) {
    pixel = vec4(.08,.12,.16,.52);
    return;
  }
  if (mode == 1) {
    vec2 p = world.xz;
    vec2 uv = p + .5;
    float inside = step(0.,uv.x)*step(0.,uv.y)*step(uv.x,1.)*step(uv.y,1.);
    float floorHeight = (texture(heightMap,clamp(uv,0.,1.)).r * .9 - .38) * relief;
    float shallow = inside * (1. - smoothstep(.003,.16,sea-floorHeight));
    float foam = inside * (1. - smoothstep(.002,.020,sea-floorHeight));
    float swell = textureNoise(p*8.);
    float wave = sin(92.*p.x+31.*p.y+time*.8+swell*8.)
        + sin(49.*p.y-24.*p.x-time+swell*5.);
    float ripples = grain(p+vec2(time*.012,-time*.009),340.);
    vec3 n = normalize(vec3(.045*wave,1.,.07*sin(73.*p.y+13.*p.x+time)));
    float reflection = pow(max(0.,dot(reflect(-light,n),viewDir)),48.);
    vec3 rgb = mix(vec3(.038,.17,.30),vec3(.13,.62,.68),shallow);
    rgb += reflection * vec3(.72,.81,.83) + wave*.012 + ripples*.065;
    rgb = mix(rgb,vec3(.77,.92,.90),foam*(.52+swell*.30));
    pixel = vec4(atmosphere(rgb,.34),1.);
    return;
  }
  vec3 n = normalize(normal);
  float band = clamp((world.y - sea) / (.31 * relief),0.,.9999) * 5.;
  int a = int(band);
  vec3 base = mix(colors[a],colors[a+1],fract(band));
  float steep = smoothstep(.17,.79,1.-n.y);
  float vegetation = textureNoise(world.xz*49.);
  float strata = sin((world.y + world.x*.11 + world.z*.07)*290.
      + textureNoise(world.xz*72.)*4.);
  float grit = grain(world.xz,480.)*.73 + grain(world.xz,1250.)*.27;
  vec3 rock = mix(vec3(.16,.19,.20),vec3(.33,.35,.33),
    clamp(.5 + strata*.18 + vegetation*.20 + grit*.34,0.,1.));
  base *= .87 + vegetation*.24 + grit*.31;
  base = mix(base,rock,steep*.85);
  float rockCrease = smoothstep(.14,.65,steep) * (.92 + strata*.08);
  float lit = .37 + .72 * max(0.,dot(n,light));
  vec3 rgb = base * lit * mix(1., rockCrease,steep*.30);
  pixel = vec4(atmosphere(rgb,.26),1.);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(shader));
  return shader;
}

function makeProgram() {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  return program;
}

const program = gl && makeProgram();
const uniforms = program && Object.fromEntries(
  ['cameraAngles','scale','relief','sea','mode','colors[0]','light','viewDir','time','heightMap']
    .map(name => [name, gl.getUniformLocation(program,name)])
);
const ground = gl && gl.createBuffer();
const surface = gl && gl.createBuffer();
const lines = gl && gl.createBuffer();
const ocean = gl && gl.createBuffer();
const heightTexture = gl && gl.createTexture();
let faces = 0;
let edges = 0;
let lastFrame = 0;
if (gl) {
  gl.bindBuffer(gl.ARRAY_BUFFER, ocean);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
    -1.3,0,-1.3,0,0, 1.3,0,-1.3,0,0, -1.3,0,1.3,0,0,
    -1.3,0,1.3,0,0, 1.3,0,-1.3,0,0, 1.3,0,1.3,0,0
  ]),gl.STATIC_DRAW);
  gl.enable(gl.DEPTH_TEST);
  gl.bindTexture(gl.TEXTURE_2D,heightTexture);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
} else {
  byId('zoomValue').value = 'Activa WebGL 2 para ver el terreno';
}

function updateGeometry() {
  if (!gl) return;
  const size = terrain.length;
  const span = size - 1;
  const vertices = new Float32Array(size * size * 5);
  const pixels = new Uint8Array(size * size);
  const triangles = [];
  const wire = [];
  for (let z = 0; z < size; z++) {
    for (let x = 0; x < size; x++) {
      const i = z * size + x;
      const left = Math.max(0,x-1), right = Math.min(span,x+1);
      const back = Math.max(0,z-1), front = Math.min(span,z+1);
      vertices.set([x/span-.5,terrain[z][x],z/span-.5,
        (terrain[z][right]-terrain[z][left])*span/(right-left),
        (terrain[front][x]-terrain[back][x])*span/(front-back)],i*5);
      pixels[i] = Math.round(limit((terrain[z][x]+.38)/.9,0,1)*255);
      if (x < span && z < span) {
        triangles.push(i,i+1,i+size,i+1,i+size+1,i+size);
        wire.push(i,i+1,i,i+size,i+1,i+size);
      }
      if (z === span && x < span) wire.push(i,i+1);
      if (x === span && z < span) wire.push(i,i+size);
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,ground);
  gl.bufferData(gl.ARRAY_BUFFER,vertices,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,surface);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(triangles),gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,lines);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(wire),gl.STATIC_DRAW);
  faces = triangles.length;
  edges = wire.length;
  gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.R8,size,size,0,gl.RED,gl.UNSIGNED_BYTE,pixels);
}

function bindVertices(buffer) {
  gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,3,gl.FLOAT,false,20,0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1,2,gl.FLOAT,false,20,12);
}

function draw(now = performance.now()) {
  frame = 0;
  if (!gl) return;
  const ratio = Math.min(devicePixelRatio || 1,2);
  const width = Math.round(canvas.clientWidth * ratio);
  const h = Math.round(canvas.clientHeight * ratio);
  if (!width || !h) return;
  if (canvas.width !== width) canvas.width = width;
  if (canvas.height !== h) canvas.height = h;
  if (orbit.checked && !pointer && lastFrame) camera.yaw += Math.min(now-lastFrame,40)*.00020;
  lastFrame = now;
  const solar = sun.valueAsNumber * Math.PI / 180;
  const relief = height.valueAsNumber;
  const sea = (water.valueAsNumber / 100 - .30) * .42 * relief;
  const yaw = camera.yaw, pitch = camera.pitch;
  const zoom = camera.zoom;
  const fit = Math.min(1.7, 1.34 * h/width) * zoom;
  gl.viewport(0,0,width,h);
  gl.clearColor(.66,.76,.84,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.uniform4f(uniforms.cameraAngles,Math.cos(yaw),Math.sin(yaw),Math.cos(pitch),Math.sin(pitch));
  gl.uniform2f(uniforms.scale,fit,fit*width/h);
  gl.uniform1f(uniforms.relief,relief);
  gl.uniform1f(uniforms.sea,sea);
  gl.uniform1f(uniforms.time,now*.001);
  gl.uniform3f(uniforms.light,-.62*Math.cos(solar),Math.sin(solar),.7846*Math.cos(solar));
  gl.uniform3f(uniforms.viewDir,Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));
  gl.uniform3fv(uniforms['colors[0]'],palette.flat().map(channel=>channel/255));
  gl.uniform1i(uniforms.mode,1);
  bindVertices(ocean);
  gl.drawArrays(gl.TRIANGLES,0,6);
  gl.uniform1i(uniforms.mode,0);
  bindVertices(ground);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,surface);
  gl.enable(gl.POLYGON_OFFSET_FILL);
  gl.polygonOffset(1,1);
  gl.drawElements(gl.TRIANGLES,faces,gl.UNSIGNED_INT,0);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  if (mesh.checked) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform1i(uniforms.mode,2);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,lines);
    gl.drawElements(gl.LINES,edges,gl.UNSIGNED_INT,0);
    gl.disable(gl.BLEND);
  }
  byId('zoomValue').value = zoom.toFixed(1) + '×';
  if (orbit.checked) queueDraw();
}

function limit(value, low, high) {
  return Math.max(low, Math.min(high, value));
}

function rotate(dx, dy) {
  camera.yaw += dx;
  camera.pitch = limit(camera.pitch + dy, .16, 1.43);
  queueDraw();
}

function zoom(factor) {
  camera.zoom = limit(camera.zoom * factor, .55, 12);
  queueDraw();
}

function updateLighting() {
  byId('sunValue').value = sun.value + '°';
  byId('waterValue').value = water.value + ' %';
  queueDraw();
}
sun.addEventListener('input', updateLighting);
water.addEventListener('input', updateLighting);
island.addEventListener('change', rebuild);
orbit.addEventListener('change', () => {
  lastFrame = 0;
  queueDraw();
});
roughness.addEventListener('input', rebuild);
detail.addEventListener('input', rebuild);
height.addEventListener('input', changeHeight);
mesh.addEventListener('change', queueDraw);
paletteSelect.addEventListener('change', changePalette);
byId('save').addEventListener('click', () => {
  if (frame) {
    cancelAnimationFrame(frame);
    draw();
  }
  const link = document.createElement('a');
  link.download = 'terreno-fractal-' + seed.value + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
seed.addEventListener('change', () => {
  seed.value = limit(Math.trunc(seed.valueAsNumber || 0), 0, 4294967295);
  rebuild();
});
byId('random').addEventListener('click', () => {
  seed.value = Math.floor(Math.random() * 4294967296);
  rebuild();
});
byId('reset').addEventListener('click', () => {
  Object.assign(camera, initialCamera);
  queueDraw();
});

let pointer;
canvas.addEventListener('pointerdown', event => {
  if (event.button !== 0 || pointer) return;
  pointer = {id: event.pointerId, x: event.clientX, y: event.clientY};
  canvas.setPointerCapture(pointer.id);
  canvas.focus();
});
canvas.addEventListener('pointermove', event => {
  if (pointer?.id !== event.pointerId) return;
  rotate((event.clientX - pointer.x) * .009, (event.clientY - pointer.y) * .008);
  pointer.x = event.clientX;
  pointer.y = event.clientY;
});
canvas.addEventListener('lostpointercapture', event => {
  if (pointer?.id === event.pointerId) pointer = undefined;
});
canvas.addEventListener('wheel', event => {
  event.preventDefault();
  zoom(Math.exp(-limit(event.deltaY, -120, 120) * .0016));
}, {passive:false});
canvas.addEventListener('keydown', event => {
  switch (event.key) {
    case 'ArrowLeft': rotate(-.12, 0); break;
    case 'ArrowRight': rotate(.12, 0); break;
    case 'ArrowUp': rotate(0, -.10); break;
    case 'ArrowDown': rotate(0, .10); break;
    case '+': case '=': zoom(1.14); break;
    case '-': zoom(1 / 1.14); break;
    default: return;
  }
  event.preventDefault();
});
new ResizeObserver(queueDraw).observe(canvas);
rebuild();
changeHeight();
changePalette();
updateLighting();
</script>
</body>
